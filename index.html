<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Skyjo Scorekeeper</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--accent:#334155;--line:#e5e7eb;--good:#166534}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:720px;margin:auto;padding:22px 16px 40px}
h1{margin:0;font-size:30px} h2{font-size:20px;margin:0 0 12px}
.sub{color:var(--muted);margin:4px 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;padding:13px 12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:white}
button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#111827;color:#fff}.secondary{background:#eef2f7;color:#172033}.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:9px;align-items:end}.row>*{flex:1}.row button{flex:0 0 auto}
.players{display:grid;grid-template-columns:1fr 42px;gap:8px;margin-top:10px}
.players input{grid-column:1}.remove{grid-column:2;height:46px;padding:0}
.scoregrid{overflow-x:auto}.scoregrid table{width:100%;border-collapse:collapse;min-width:440px}
th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}.total{font-weight:800;font-size:18px}
.leader{color:var(--good)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.empty{color:var(--muted);font-size:14px}
.small{font-size:13px;color:var(--muted)}
@media(max-width:430px){main{padding:18px 12px 32px}.card{padding:15px}h1{font-size:27px}}
</style>
</head>
<body>
<main>
  <h1>🃏 Skyjo Scorekeeper</h1>
  <p class="sub">Fast, simple scorekeeping for game night.</p>

  <section class="card">
    <h2>Players</h2>
    <div id="players"></div>
    <div class="actions">
      <button class="secondary" id="addPlayer">+ Add player</button>
      <button class="primary" id="startGame">Start game</button>
    </div>
  </section>

  <section class="card" id="game" hidden>
    <div class="row" style="justify-content:space-between;align-items:center">
      <div><h2>Scores</h2><div class="small">Lowest total score wins.</div></div>
      <button class="secondary" id="newGame">New game</button>
    </div>
    <div class="scoregrid" id="scoreGrid"></div>
    <div class="actions">
      <button class="primary" id="addRound">+ Add round</button>
      <button class="secondary" id="undo">Undo last round</button>
      <button class="danger" id="resetScores">Reset scores</button>
    </div>
  </section>
</main>

<script>
(() => {
  const playersEl=document.getElementById('players');
  const gameEl=document.getElementById('game');
  const gridEl=document.getElementById('scoreGrid');
  let players=[], rounds=[];

  function renderPlayers(){
    playersEl.innerHTML='';
    if(!players.length) addPlayer();
    players.forEach((name,i)=>{
      const wrap=document.createElement('div'); wrap.className='players';
      const input=document.createElement('input');
      input.value=name; input.placeholder=`Player ${i+1}`; input.setAttribute('aria-label',`Player ${i+1} name`);
      input.addEventListener('input',()=>{players[i]=input.value;});
      const remove=document.createElement('button'); remove.className='remove danger'; remove.textContent='×'; remove.type='button';
      remove.title='Remove player'; remove.disabled=players.length<=2;
      remove.addEventListener('click',()=>{players.splice(i,1); renderPlayers();});
      wrap.append(input,remove); playersEl.appendChild(wrap);
    });
  }
  function addPlayer(){ if(players.length>=12)return; players.push(`Player ${players.length+1}`); renderPlayers(); }
  function cleanNames(){
    players=players.map((p,i)=>p.trim()||`Player ${i+1}`);
  }
  function totals(){ return players.map((_,i)=>rounds.reduce((s,r)=>s+(Number(r[i])||0),0)); }

  function render(){
    const t=totals();
    let html='<table><thead><tr><th>Player</th>';
    rounds.forEach((_,r)=>html+=`<th>R${r+1}</th>`);
    html+='<th>Total</th></tr></thead><tbody>';
    players.forEach((p,i)=>{
      html+=`<tr><td><strong>${escapeHtml(p)}</strong></td>`;
      rounds.forEach(r=>html+=`<td>${r[i]}</td>`);
      html+=`<td class="total">${t[i]}</td></tr>`;
    });
    html+='</tbody></table>';
    if(rounds.length===0) html+='<p class="empty">No rounds yet. Tap “Add round” after each hand.</p>';
    gridEl.innerHTML=html;
  }

  function addRound(){
    const scores=[];
    players.forEach((p,i)=>{
      const raw=prompt(`Enter ${p}'s score for round ${rounds.length+1}:`);
      if(raw===null) return;
      const n=Number(raw);
      scores[i]=Number.isFinite(n)?n:0;
    });
    if(scores.length!==players.length || scores.some(v=>v===undefined)){
      alert('Round cancelled. Please enter a score for every player.');
      return;
    }
    rounds.push(scores); render();
  }

  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  document.getElementById('addPlayer').addEventListener('click',addPlayer);
  document.getElementById('startGame').addEventListener('click',()=>{
    cleanNames(); if(players.length<2){alert('Add at least 2 players.');return;}
    rounds=[]; render(); gameEl.hidden=false; gameEl.scrollIntoView({behavior:'smooth'});
  });
  document.getElementById('newGame').addEventListener('click',()=>{
    if(confirm('Start a new game? Current scores will be cleared.')){rounds=[];render();}
  });
  document.getElementById('addRound').addEventListener('click',addRound);
  document.getElementById('undo').addEventListener('click',()=>{
    if(!rounds.length){return} rounds.pop(); render();
  });
  document.getElementById('resetScores').addEventListener('click',()=>{
    if(confirm('Clear all rounds?')){rounds=[];render();}
  });
  renderPlayers();
})();
</script>
</body>
</html>
