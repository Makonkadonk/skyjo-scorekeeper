<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyjo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="skyjo-icon.png">
<title>Skyjo</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#172033;--muted:#697386;
  --accent:#111827;--soft:#eef2f7;--line:#e3e7ee;
  --green:#166534;--green-bg:#dcfce7;--red:#991b1b;--red-bg:#fee2e2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{border:0;cursor:pointer;-webkit-appearance:none}
.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg)}
.topbar{
  position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  background:rgba(244,246,249,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:space-between
}
.brand{font-weight:850;font-size:22px;letter-spacing:-.5px}
.brand span{font-size:20px;margin-right:6px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:0 1px 4px #00000010;font-size:19px}
main{padding:4px 14px calc(28px + env(safe-area-inset-bottom))}
.hero{padding:20px 4px 14px}
.hero h1{font-size:31px;line-height:1.05;margin:0 0 7px;letter-spacing:-1px}
.hero p{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}
.card h2{margin:0;font-size:19px;letter-spacing:-.3px}
.field{margin-top:11px;display:grid;grid-template-columns:1fr 44px;gap:8px}
.field input{width:100%;height:48px;border:1px solid #d6dbe4;border-radius:14px;padding:0 14px;font-size:17px;background:#fff;outline:none}
.field input:focus{border-color:#9aa4b2;box-shadow:0 0 0 3px #11182712}
.remove{height:48px;border-radius:14px;background:var(--red-bg);color:var(--red);font-size:20px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:48px;border-radius:15px;padding:0 16px;font-weight:750;font-size:15px}
.primary{background:var(--accent);color:#fff;flex:1}
.secondary{background:var(--soft);color:var(--text)}
.danger{background:var(--red-bg);color:var(--red)}
.hidden{display:none!important}
.score-card{padding:0;overflow:hidden}
.score-head{padding:17px 17px 12px;display:flex;justify-content:space-between;align-items:center}
.score-head .small{color:var(--muted);font-size:13px;margin-top:3px}
.new-btn{background:var(--soft);border-radius:13px;padding:11px 13px;font-weight:700}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:330px}
th,td{padding:12px 10px;border-top:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
td{font-size:16px}
.total{font-weight:850;font-size:18px}
.winner{background:var(--green-bg);color:var(--green)}
.empty{padding:0 17px 17px;color:var(--muted);font-size:14px}
.round-panel{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 8px #00000008}
.round-title{padding:17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.round-title h2{margin:0;font-size:19px}
.round-title button{background:var(--soft);border-radius:12px;padding:9px 12px;font-weight:700}
.entry-player{padding:17px 17px 10px}
.entry-label{color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.entry-name{font-size:26px;font-weight:850;margin:2px 0 5px;letter-spacing:-.6px}
.entry-value{font-size:46px;line-height:1;font-weight:900;min-height:50px;letter-spacing:-1px}
.entry-hint{font-size:12px;color:var(--muted);margin-top:5px}
.keypad{padding:10px 12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.key{height:62px;border-radius:17px;background:var(--soft);font-size:24px;font-weight:750;color:var(--text);box-shadow:inset 0 -1px #00000005}
.key:active{transform:scale(.98);background:#e2e7ef}
.key.action{font-size:17px}
.key.next{grid-column:1/-1;background:var(--accent);color:#fff;height:54px;font-size:16px}
.key.minus{font-size:25px}
.progress{display:flex;gap:5px;padding:0 17px 16px}
.dot{height:5px;flex:1;border-radius:8px;background:#dfe4eb}
.dot.active{background:#111827}
.summary{padding:15px 17px;background:#f8fafc;border-top:1px solid var(--line)}
.summary-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.summary-row strong{font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111827;color:white;padding:11px 15px;border-radius:14px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){
  .key{height:57px}.entry-value{font-size:42px}.hero h1{font-size:28px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span>🃏</span>Skyjo</div>
    <button class="icon-btn" id="topNew" aria-label="New game">＋</button>
  </header>

  <main>
    <section class="hero">
      <h1>Scorekeeper</h1>
      <p>Simple scoring for game night.</p>
    </section>

    <section class="card" id="setup">
      <h2>Players</h2>
      <div id="players"></div>
      <div class="actions">
        <button class="btn secondary" id="addPlayer">＋ Add player</button>
        <button class="btn primary" id="startGame">Start game</button>
      </div>
    </section>

    <section class="round-panel hidden" id="roundPanel">
      <div class="round-title">
        <h2 id="roundTitle">Round 1</h2>
        <button id="cancelRound">Cancel</button>
      </div>
      <div class="entry-player">
        <div class="entry-label">Enter score for</div>
        <div class="entry-name" id="entryName"></div>
        <div class="entry-value" id="entryValue">0</div>
        <div class="entry-hint">Use − for a negative score</div>
      </div>
      <div class="progress" id="progress"></div>
      <div class="keypad">
        <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
        <button class="key minus" data-key="-">−</button><button class="key" data-key="0">0</button><button class="key action" data-key="back">⌫</button>
        <button class="key action" data-key="clear">Clear</button>
        <button class="key next" id="nextScore">Next player →</button>
      </div>
      <div class="summary">
        <div class="summary-row"><span>Players entered</span><strong id="enteredCount">0 / 0</strong></div>
      </div>
    </section>

    <section class="card score-card hidden" id="game">
      <div class="score-head">
        <div><h2>Scores</h2><div class="small">Lowest total score wins.</div></div>
        <button class="new-btn" id="newGame">New game</button>
      </div>
      <div class="table-wrap" id="scoreGrid"></div>
      <div class="empty" id="emptyRounds">No rounds yet. Tap “Add round” to enter scores.</div>
      <div class="actions" style="padding:0 17px 17px">
        <button class="btn primary" id="addRound">＋ Add round</button>
        <button class="btn secondary" id="undo">Undo last round</button>
        <button class="btn danger" id="resetScores">Reset scores</button>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let players = [];
  let rounds = [];
  let entryScores = [];
  let entryIndex = 0;
  let currentValue = "";

  function renderPlayers(){
    const el=$("players"); el.innerHTML="";
    players.forEach((name,i)=>{
      const row=document.createElement("div"); row.className="field";
      const input=document.createElement("input");
      input.value=name; input.placeholder=`Player ${i+1}`; input.inputMode="text";
      input.addEventListener("input",()=>players[i]=input.value);
      const remove=document.createElement("button");
      remove.className="remove"; remove.textContent="×"; remove.disabled=players.length<=2;
      remove.addEventListener("click",()=>{players.splice(i,1);renderPlayers()});
      row.append(input,remove); el.appendChild(row);
    });
  }
  function addPlayer(){
    if(players.length>=12){showToast("Maximum 12 players");return}
    players.push(`Player ${players.length+1}`); renderPlayers();
  }
  function cleanNames(){players=players.map((p,i)=>p.trim()||`Player ${i+1}`)}
  function totals(){return players.map((_,i)=>rounds.reduce((s,r)=>s+(Number(r[i])||0),0))}
  function render(){
    const t=totals();
    $("emptyRounds").classList.toggle("hidden",rounds.length>0);
    let html="<table><thead><tr><th>Player</th>";
    rounds.forEach((_,r)=>html+=`<th>R${r+1}</th>`);
    html+="<th>Total</th></tr></thead><tbody>";
    const min=rounds.length?Math.min(...t):null;
    players.forEach((p,i)=>{
      html+=`<tr class="${rounds.length&&t[i]===min?'winner':''}"><td><strong>${escapeHtml(p)}</strong></td>`;
      rounds.forEach(r=>html+=`<td>${r[i]}</td>`);
      html+=`<td class="total">${t[i]}</td></tr>`;
    });
    html+="</tbody></table>";
    $("scoreGrid").innerHTML=html;
  }
  function startGame(){
    cleanNames();
    if(players.length<2){showToast("Add at least 2 players");return}
    rounds=[]; render();
    $("setup").classList.add("hidden");
    $("game").classList.remove("hidden");
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function openRound(){
    entryScores=new Array(players.length);
    entryIndex=0; currentValue="";
    $("roundTitle").textContent=`Round ${rounds.length+1}`;
    $("roundPanel").classList.remove("hidden");
    $("game").classList.add("hidden");
    showEntry();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function showEntry(){
    $("entryName").textContent=players[entryIndex];
    $("entryValue").textContent=currentValue===""?"0":currentValue;
    $("enteredCount").textContent=`${entryIndex} / ${players.length}`;
    const p=$("progress"); p.innerHTML="";
    players.forEach((_,i)=>{const d=document.createElement("div");d.className="dot"+(i===entryIndex?" active":"");p.appendChild(d)});
    $("nextScore").textContent=entryIndex===players.length-1?"Finish round ✓":"Next player →";
  }
  function keyPress(k){
    if(k==="clear"){currentValue="";showEntry();return}
    if(k==="back"){currentValue=currentValue.slice(0,-1);showEntry();return}
    if(k==="-"){
      if(currentValue==="") currentValue="-";
      else if(!currentValue.startsWith("-")) currentValue="-"+currentValue;
      showEntry(); return;
    }
    if(currentValue==="0") currentValue="";
    if(currentValue==="-" ) currentValue="-";
    currentValue += k;
    if(currentValue==="-" ) currentValue="-";
    showEntry();
  }
  function nextScore(){
    if(currentValue===""||currentValue==="-"){showToast("Enter a score first");return}
    entryScores[entryIndex]=Number(currentValue);
    if(entryIndex<players.length-1){entryIndex++;currentValue="";showEntry()}
    else{
      rounds.push(entryScores.slice());
      $("roundPanel").classList.add("hidden");
      $("game").classList.remove("hidden");
      render();
      showToast("Round added!");
      window.scrollTo({top:0,behavior:"smooth"});
    }
  }
  function cancelRound(){
    $("roundPanel").classList.add("hidden");
    $("game").classList.remove("hidden");
  }
  function newGame(){
    if(confirm("Start a new game? Current scores will be cleared.")){
      rounds=[]; $("game").classList.add("hidden"); $("setup").classList.remove("hidden");
      renderPlayers(); window.scrollTo({top:0,behavior:"smooth"});
    }
  }
  function resetScores(){
    if(confirm("Clear all rounds?")){rounds=[];render()}
  }
  function undo(){if(rounds.length){rounds.pop();render();showToast("Last round removed")}}
  function showToast(msg){
    const t=$("toast");t.textContent=msg;t.classList.add("show");
    clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1600);
  }
  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

  $("addPlayer").onclick=addPlayer;
  $("startGame").onclick=startGame;
  $("addRound").onclick=openRound;
  $("cancelRound").onclick=cancelRound;
  $("nextScore").onclick=nextScore;
  $("newGame").onclick=newGame;
  $("topNew").onclick=()=>{if($("game").classList.contains("hidden")) return;newGame()};
  $("resetScores").onclick=resetScores;
  $("undo").onclick=undo;
  document.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>keyPress(b.dataset.key)));

  // Start with two players.
  players=["Player 1","Player 2"];
  renderPlayers();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
})();
</script>
</body>
</html>
